services:
  mosquitto:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mosquitto-client-metrics:2.1.4
    ports:
      - "1883:1883"
    volumes:
      # Override with your own config if needed:
      # - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
volumes:
  mosquitto-data:
