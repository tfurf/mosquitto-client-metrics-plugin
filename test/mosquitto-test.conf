# Test config: deliberately tiny limits so drops are easy to provoke.
plugin /usr/lib/mosquitto_client_metrics.so
plugin_opt_interval 2
plugin_opt_format both

listener 1883
allow_anonymous true

max_inflight_messages 10
max_queued_messages 50
sys_interval 1
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
