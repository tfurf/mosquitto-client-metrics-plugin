# Load client-metrics FIRST, before any auth/ACL plugin (it must see ACL READ
# checks to count routed/dropped messages; it never affects access decisions).
plugin /usr/lib/mosquitto_client_metrics.so
plugin_opt_interval 10
#plugin_opt_enabled true
#plugin_opt_topic_prefix $SYS/client-metrics
#plugin_opt_format topics
#plugin_opt_offline_retention 3600
#plugin_opt_retain true
#plugin_opt_summary_top 10
#plugin_opt_log_drops true

listener 1883
allow_anonymous true

log_dest stdout
